<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DenguePredict{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="{{ url_for('index') }}">
        <span class="logo-mark">+</span>
        <span>Predecir<span class="logo-accent">Dengue</span></span>
      </a>
      <nav class="main-nav">
        <a href="{{ url_for('index') }}">Inicio</a>
        <a href="{{ url_for('individual') }}"><span>01</span> Individual</a>
        <a href="{{ url_for('batch') }}"><span>02</span> Por lote</a>
      </nav>
      <div class="header-status"><i></i> Modelos activos</div>
    </header>

    <main class="page-container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% for
      category, message in messages %}
      <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %} {% endwith %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
